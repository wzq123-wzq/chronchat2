                // mui 滚动初始化(只执行一次,在 mounted 中调用)
                initMuiScroll() {
                    if (document.querySelector('#convo .mui-scroll-wrapper')._muiInited) return;
                    document.querySelector('#convo .mui-scroll-wrapper')._muiInited = true;
                    mui('.mui-scroll-wrapper').scroll({
                        scrollY: true, //是否竖向滚动
                        scrollX: false, //是否横向滚动
                        startX: 0, //初始化时滚动至x
                        startY: 0, //初始化时滚动至y
                        indicators: true, //是否显示滚动条
                        deceleration: 0.0006, //阻尼系数,系数越小滑动越灵敏
                        bounce: true //是否启用回弹
                    });

                // 挂载 Pointer 手势实现下拉加载历史消息(只挂一次,在 mounted 中调用)
                // 用 pointer 事件统一支持 鼠标拖动(PC调试) 和 触摸下拉(真机)
                // 流程: pointerdown(触顶才进入) → pointermove(跟手位移+阻尼) → pointerup(回弹动画→触发请求)
                initPullToRefresh() {
                    var that = this;
                    var wrapper = document.querySelector('#convo .mui-scroll-wrapper');
                    var scrollInner = document.querySelector('#convo .mui-scroll');
                    if (!wrapper || !scrollInner) return;
                    if (wrapper._pullInited) return;
                    wrapper._pullInited = true;
                    // 禁用浏览器默认触摸手势(滚动/下拉刷新),滚动全部交给 mui 和本手势控制
                    scrollInner.style.touchAction = 'none';

                    // 判断当前 mui-scroll 是否在"顶部区域"(内容上边沿未被推离顶部)
                    function isAtTop() {
                        // Y >= 0 即视为在顶部:
                        //   translateY(正数/0)  ← 消息少无滚动空间时 showmsg 的定位值
                        //   translate3d(0,0,0)  ← 滚回顶部后 mui 的归位值
                        // Y 为负数说明还在列表中部/底部,不允许触发下拉加载
                        var transform = scrollInner.style.transform || '';
                        var match3d = transform.match(/translate3d\(\d+px,\s*(-?\d+)px,\s*\d+\)/i);
                        if (match3d && parseInt(match3d[1], 10) >= 0) return true;
                        var matchY = transform.match(/translateY\((-?\d+)px\)/i);
                        if (matchY && parseInt(matchY[1], 10) >= 0) return true;
                        // 回退: 用 scrollTop 判断
                        if (wrapper.scrollTop === 0) return true;
                        return false;
                    }

                    wrapper.addEventListener('pointerdown', function (e) {
                        if (that.win !== 'single' && that.win !== 'group') return;
                        if (that.isLoadMore) return;
                        // 只有已经在顶部了,才允许进入下拉模式
                        if (!isAtTop()) return;
                        that._pullStartY = e.clientY;
                        that._pullDistance = 0;
                        that._isPulling = true;
                        // 捕获指针:即使鼠标移出元素,pointerup 也一定派发到 wrapper
                        try { wrapper.setPointerCapture(e.pointerId); } catch (err) { }
                    });

                    wrapper.addEventListener('pointermove', function (e) {
                        if (!that._isPulling) return;
                        var dy = e.clientY - that._pullStartY;
                        if (dy <= 0) {
                            // 往上滑,回到 0,并退出下拉模式让 mui 接管正常滚动
                            that._pullDistance = 0;
                            that._isPulling = false;
                            scrollInner.style.transition = 'none';
                            scrollInner.style.transform = 'translate3d(0, 0px, 0)';
                            return;
                        }
                        // 阻尼系数: 越往下越拉不动,体验更像微信
                        var dampened = dy * 0.5;
                        that._pullDistance = dampened;
                        // 跟手位移
                        scrollInner.style.transition = 'none';
                        scrollInner.style.transform = 'translate3d(0, ' + dampened + 'px, 0)';
                    });

                    function endPull() {
                        if (!that._isPulling) return;
                        that._isPulling = false;
                        var dist = that._pullDistance;
                        that._pullDistance = 0;
                        // 回弹到顶部位置
                        scrollInner.style.transition = 'transform 0.25s ease-out';
                        scrollInner.style.transform = 'translate3d(0, 0px, 0)';
                        // 动画结束后必须清除 transition,否则残留会干扰 mui 后续滚动和 isAtTop 判断
                        setTimeout(function () { scrollInner.style.transition = ''; }, 300);
                        if (dist >= that.pullThreshold && !that.isLoadMore) {
                            that.isLoadMore = true;
                            // 翻页游标用真实已加载条数,而不是假设首拉拿满10条
                            that.start = that.loaded;
                            that.end = that.loaded + 1;
                            // transitionend 可能不触发(距离为0或浏览器兼容问题),加 setTimeout 兜底
                            var fired = false;
                            var trigger = function () {
                                if (fired) return;
                                fired = true;
                                that._loadMoreHistory();
                            };
                            scrollInner.addEventListener('transitionend', function onEnd() {
                                scrollInner.removeEventListener('transitionend', onEnd);
                                trigger();
                            });
                            setTimeout(trigger, 350); // 比 transition(250ms) 稍长
                        }
                    }
                    wrapper.addEventListener('pointerup', endPull);
                    wrapper.addEventListener('pointercancel', endPull);
                },
                // 下拉加载更早的历史消息(Redis 不够时后端会回查 MySQL 补货)
                _loadMoreHistory() {
                    var that = this;
                    var targetId = this.msgcontext.TargetId;
                    if (!targetId || targetId < 0) {
                        this.isLoadMore = false;
                        return;
                    }
                    // 用 TargetId 反查当前会话对象(私聊从 friends 找,群聊从 communitys 找)
                    var userObj = null;
                    if (this.msgcontext.Type === 1) {
                        this.friends.map(function (item) { if (item.ID == targetId) userObj = item; });
                    } else if (this.msgcontext.Type === 2) {
                        this.communitys.map(function (item) { if (item.ID == targetId) userObj = item; });
                    }
                    post("user/redisMsg", {
                        userIdA: userId(),
                        userIdB: targetId,
                        start: this.start,
                        end: this.end,
                        isRev: false
                    }, function (res) {
                        if (res.Total && res.Total.length > 0) {
                            for (var i in res.Total) {
                                that.showmsg(userObj, JSON.parse(res.Total[i]), true);
                            }
                            // 累计真实加载条数
                            that.loaded += res.Total.length;
                        } else {
                            // 没有更早的消息了,给用户明确反馈
                            mui.toast("没有更多历史消息了");
                        }
                        // 300ms 防抖解锁,避免连续触发
                        setTimeout(function () {
                            that.isLoadMore = false;
                        }, 300);
                    });
                    // 兜底:即使请求异常回调未执行,2秒后强制解锁,防止下拉功能永久卡死
                    setTimeout(function () {
                        that.isLoadMore = false;
                    }, 2000);
                },

                                that.loadfriends();
                            } else {
                                mui.toast(res.Msg);
                            }
                        })
                    }
                },
                //个人资料修改显示
                setUserInfo: function () {
                    this.win = "userinfo"
                    //  console.log("createCom")
                },
                //新建群显示
                createCom: function () {
                    this.win = "community"
                    //  console.log("createCom")
                },

                //新建群提交
                createcommunity() {
                    //console.log("createcommunity")
                    this.com.ownerId = userId()
                    console.log(this.com)
                    util.post("/contact/createCommunity", this.com).then(res => {
                        console.log(res)
                        if (res.Code != 0) {
                            mui.toast(res.Msg)
                        } else {
                            //location.replace("localhost:8081")
                            //location.href = "/"
                            mui.toast("建群成功")
                            this.loadcommunitys();
                            //goBack()
                        }
                    })
                },
                updateUserInfo() {
                    //console.log("createcommunity")
                    this.info.id = userId()
                    util.post("/user/updateUser", this.info).then(res => {
                        console.log(res)
                        let userInfo = JSON.parse(sessionStorage.getItem('userinfo') || '{}');
                        userInfo.Avatar = this.info.icon;
                        userInfo.Name = this.info.name;
                        sessionStorage.setItem('userinfo', JSON.stringify(userInfo))
                        if (res.Code != 0) {
                            mui.toast(res.message)
                        } else {
                            //location.replace("localhost:8081")
                            //location.href = "/"
                            mui.toast("修改成功")
                            //goBack()
                        }
                    })
                },



                //回到聊天首页
                goBack() {
                    this.win = "main"
                },

                _joincomunity: function (dstobj) {
                    if (this.isDisable) {
                        this.setTimeFlag();
                        var that = this;
                        console.log(that);
                        post("contact/joinGroup", { comId: dstobj, "userId": userId() }, function (res) {
                            if (res.Code == 0) {
                                mui.toast("添加成功");

                                that.loadcommunitys();
                            } else {
                                mui.toast(res.Msg);
                            }
                        })
                    }
                },
                joincom: function () {
                    var that = this;
                    mui.prompt('', '请输入群号或者群名称', '加群', ['取消', '确认'], function (e) {
                        if (e.index == 1) {
                            //    if (isNaN(e.value) || e.value <= 0) {
                            //       mui.toast('格式错误');
                            //   } else {
                            //mui.toast(e.value);
                            that._joincomunity(e.value)
                            // }
                        } else {
                            //mui.toast('您取消了入库');
                        }
                    }, 'div');
                    document.querySelector('.mui-popup-input input').type = 'text';
                },
                quit: function () {
                    sessionStorage.removeItem("userid")
                    sessionStorage.removeItem("userinfo")
                    location.href = "/"
                },
                setTimeFlag() {
                    this.isDisable = false;
                    setTimeout(() => {
                        this.isDisable = true;
                    }, 100)
                },
                heartbeat() {
                    if (this.webSocket.readyState == 1) {  //失去连接 3
                        var msg = this.createmsgcontext();
                        msg.Media = -1;
                        msg.Type = 3
                        msg.Content = "心跳";
                        //this.showmsg(userInfo(),msg);
                        this.webSocket.send(JSON.stringify(msg))
                    }

                }


            },
            watch: {
                "win": function (n, o) {
                    // console.log("watch",o,n)
                    if (n != "main") {
                        document.getElementById("menubar").style.display = "none";
                    } else {
                        document.getElementById("menubar").style.display = "block";
                    }
                }
            }
        }
    )

</script>
